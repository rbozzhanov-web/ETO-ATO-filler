name: Fix Journey Log header once

on:
  push:
    branches: [hardening/presentation-gates-20260902]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'RUN_JL_HEADER_FIX')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/presentation-gates-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove toolbar-only subtitle that overflows narrow portrait viewports
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('journey-log.html')
          s = p.read_text()
          old = '<h1>Journey Log <span>Electronic filling tool</span> <span class="buildbadge" id="buildBadge">RC 1.3 · TEST · Build 20260902.3</span></h1>'
          new = '<h1>Journey Log <span class="buildbadge" id="buildBadge">RC 1.3 · TEST · Build 20260902.3</span></h1>'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
      - name: Run unit and structure tests
        run: npm test
      - name: Commit exact fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journey-log.html
          git diff --cached --check
          git commit -m "Fix Journey Log narrow portrait toolbar overflow"
          git push origin HEAD:hardening/presentation-gates-20260902
