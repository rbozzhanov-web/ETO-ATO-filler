name: Apply presentation hardening once

on:
  push:
    branches: [hardening/presentation-gates-20260902]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'RUN_PRESENTATION_HARDENING')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/presentation-gates-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed replacements
        run: node .github/patch-presentation-hardening.mjs
      - name: Run unit and structure tests
        run: npm test
      - name: Commit hardened files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofp-core.js journey-log.js index.html journey-log.html README.md sw.js tests/ofp-core.test.js tests/journey-log-edge-cases.test.js tests/smoke/run.mjs
          git diff --cached --check
          git commit -m "RC 1.3 TEST build 20260902.3 — presentation hardening"
          git push origin HEAD:hardening/presentation-gates-20260902
