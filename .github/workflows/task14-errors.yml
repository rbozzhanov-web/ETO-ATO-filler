name: Task 14 user-facing errors

on:
  push:
    branches: [hardening/reliability-plan]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[task14-errors]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/reliability-plan
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Make user errors actionable and keep diagnostics internal
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app.js'); s = p.read_text()
          changes = [
            ("""    // Name what was actually offered, so a report of this carries evidence.\n    const had = [...new Set(items.flatMap(i => i.types))].join(', ');\n    msg('#m1', 'No PDF on the clipboard' + (had ? ' — it offered: ' + had : '')\n             + '. Use the box above to pick the file.', 'warn');\n  } catch (err){\n    msg('#m1', 'The clipboard could not be read here (' + err.message\n             + '). Use the box above to pick the file.', 'warn');\n  }\n""",
             """    msg('#m1', 'No PDF was found on the clipboard. Use the box above to pick the file.', 'warn');\n  } catch (err){\n    console.warn('Clipboard read failed:', err);\n    msg('#m1', 'The clipboard could not be read. Use the box above to pick the file instead.', 'warn');\n  }\n"""),
            ("msg('#m1', 'Browser too old: no DecompressionStream. Safari 16.4+ / iPadOS 16.4+ required.', 'err');",
             "msg('#m1', 'This browser is not supported. OFP Companion requires Safari/iPadOS 16.4 or later.', 'err');"),
            ("""  } catch (err){\n    msg('#m1', 'Could not parse the document: ' + err.message, 'err');\n    return false;\n  }\n""",
             """  } catch (err){\n    console.error('OFP parse failed:', err);\n    msg('#m1', 'This PDF could not be read as a supported flight-plan package. Try another OFP PDF.', 'err');\n    return false;\n  }\n""")
          ]
          for old, new in changes:
            assert s.count(old) == 1, 'app.js error-message anchor changed: ' + old[:50]
            s = s.replace(old, new)
          p.write_text(s)

          p = Path('journey-log.js'); s = p.read_text()
          changes = [
            ("""  }catch(err){\n    if(!(err && err.name === 'AbortError'))\n      say('Could not export the PDF: ' + (err && err.message ? err.message : err), 'err');\n  }finally{\n""",
             """  }catch(err){\n    if(!(err && err.name === 'AbortError')){\n      console.error('Journey Log export failed:', err);\n      say('The completed PDF could not be exported. Try Export PDF again.', 'err');\n    }\n  }finally{\n"""),
            ("say('Browser too old: no DecompressionStream. Safari 16.4+ / iPadOS 16.4+ required.', 'err');",
             "say('This browser is not supported. Journey Log requires Safari/iPadOS 16.4 or later.', 'err');"),
            ("""  }catch(err){\n    say('Could not read it: ' + (err && err.message ? err.message : err), 'err');\n  }\n""",
             """  }catch(err){\n    console.error('Journey Log PDF read failed:', err);\n    say('This PDF could not be read as a supported Journey Log. Choose the issued Journey Log PDF and try again.', 'err');\n  }\n""")
          ]
          for old, new in changes:
            assert s.count(old) == 1, 'journey-log.js error-message anchor changed: ' + old[:50]
            s = s.replace(old, new)
          p.write_text(s)

          Path('tests/user-errors.test.js').write_text(r'''\'use strict\';
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const APP = fs.readFileSync(path.join(__dirname, '..', 'app.js'), 'utf8');
          const JL = fs.readFileSync(path.join(__dirname, '..', 'journey-log.js'), 'utf8');

          test('OFP user-facing failures give an action without exposing parser details', () => {
            assert.match(APP, /This PDF could not be read as a supported flight-plan package\. Try another OFP PDF\./);
            assert.match(APP, /console\.error\('OFP parse failed:', err\)/);
            assert.doesNotMatch(APP, /Could not parse the document: ['"]?\s*\+\s*err\.message/);
          });

          test('clipboard failures stay user-readable while diagnostics remain available', () => {
            assert.match(APP, /No PDF was found on the clipboard\. Use the box above to pick the file\./);
            assert.match(APP, /The clipboard could not be read\. Use the box above to pick the file instead\./);
            assert.match(APP, /console\.warn\('Clipboard read failed:', err\)/);
            assert.doesNotMatch(APP, /it offered:/);
          });

          test('browser support errors describe the supported action rather than an API name', () => {
            assert.match(APP, /OFP Companion requires Safari\/iPadOS 16\.4 or later/);
            assert.match(JL, /Journey Log requires Safari\/iPadOS 16\.4 or later/);
            assert.doesNotMatch(APP, /Browser too old: no DecompressionStream/);
            assert.doesNotMatch(JL, /Browser too old: no DecompressionStream/);
          });

          test('Journey Log read and export failures do not expose raw exceptions in the UI', () => {
            assert.match(JL, /This PDF could not be read as a supported Journey Log\. Choose the issued Journey Log PDF and try again\./);
            assert.match(JL, /The completed PDF could not be exported\. Try Export PDF again\./);
            assert.match(JL, /console\.error\('Journey Log PDF read failed:', err\)/);
            assert.match(JL, /console\.error\('Journey Log export failed:', err\)/);
            assert.doesNotMatch(JL, /Could not export the PDF: ['"]?\s*\+/);
            assert.doesNotMatch(JL, /Could not read it: ['"]?\s*\+/);
          });
          ''')
          PY
          rm .github/workflows/task14-errors.yml
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Task 14: make user-facing errors actionable [task14-errors]"
          git push origin HEAD:hardening/reliability-plan
