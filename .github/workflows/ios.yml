name: iOS app

# Builds OFP Companion on a macOS runner and publishes an installable build.
#
# The .ipa produced here is UNSIGNED. Apple will not let an unsigned app onto a device
# directly — it has to be signed with somebody's certificate first, which is what AltStore,
# Sideloadly and the like do on your own machine with your own Apple ID. See ios/README.md.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Version to publish, e.g. v1.0.0. Leave empty to only build."
        required: false
        default: ""

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain in use
        run: |
          xcodebuild -version
          swift --version
          ls /Applications | grep -i xcode || true

      # The engine is plain Swift and its tests are the ones that mean anything, so they
      # run first and on their own: a failure here is a real defect, not a build problem.
      - name: Test OFPKit
        working-directory: ios/OFPKit
        run: swift test

      # Compiles the SwiftUI layer against the real SDK. No signing involved, so it needs
      # no secrets and runs on every push.
      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project OFPCompanion.xcodeproj \
            -scheme OFPCompanion \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log" | xcbeautify --renderer github-actions

      # xcodebuild buries the diagnostics in thousands of lines of command lines, and the
      # raw log is far too large to read through. This is the part anyone actually wants.
      - name: Diagnostics
        if: failure()
        run: |
          echo "## Compiler diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -hoE '[^ /]+\.swift:[0-9]+:[0-9]+: (error|warning): .*' \
            "$RUNNER_TEMP"/*.log | sort -u | head -80 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Archive for a device, unsigned
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project OFPCompanion.xcodeproj \
            -scheme OFPCompanion \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/OFPCompanion.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | xcbeautify --renderer github-actions

      # An .ipa is a zip with the .app inside a Payload folder, and nothing else is
      # required for a sideloader to re-sign it.
      - name: Package the IPA
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          cp -R OFPCompanion.xcarchive/Products/Applications/*.app Payload/
          zip -qry OFP-Companion.ipa Payload
          ls -lh OFP-Companion.ipa

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: OFP-Companion-ipa
          path: ${{ runner.temp }}/OFP-Companion.ipa
          if-no-files-found: error
          retention-days: 90

      # An artifact expires; a release is a stable address to send people to. Either a v*
      # tag or running this workflow by hand with a version in the box makes one — the tag
      # is created from the commit being built, so it needs no separate push.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release || github.ref_name }}
        run: |
          gh release create "$VERSION" \
            "$RUNNER_TEMP/OFP-Companion.ipa" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "OFP Companion $VERSION" \
            --notes-file .github/release-notes.md

permissions:
  contents: write
