name: Task 7 apply

on:
  push:
    branches:
      - hardening/reliability-plan

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/reliability-plan
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -qF '[task7-applied]'; then
            exit 0
          fi
          git apply --check .task7.patch
          git apply .task7.patch
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git commit -m "Task 7: harden altimeter checks after Direct-To [task7-applied]"
          git push origin HEAD:hardening/reliability-plan
