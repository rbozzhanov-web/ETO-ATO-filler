name: Fix iPad mini numpad once

on:
  push:
    branches: [hardening/presentation-gates-20260902]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'RUN_IPAD_MINI_NUMPAD_FIX')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/presentation-gates-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove competing page-scroll animation while keypad docks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app.js')
          s = p.read_text()
          old = "  setTimeout(() => { if (NP_TARGET === el) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 60);"
          new = "  requestAnimationFrame(() => { if (NP_TARGET === el) el.scrollIntoView({ block: 'center', behavior: 'auto' }); });"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
      - name: Run unit and structure tests
        run: npm test
      - name: Install WebKit
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit
      - name: Run WebKit viewport regression matrix
        run: node tests/smoke/viewports.mjs
      - name: Commit exact fix and expose object SHA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --check
          git commit -m "Stabilize iPad mini numpad docking"
          echo "PATCH_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:hardening/presentation-gates-20260902
