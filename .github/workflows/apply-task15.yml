name: Apply Task 15 input validation

on:
  push:
    branches: [hardening/reliability-plan]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/reliability-plan
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Task 15
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ofp-core.js')
          s = p.read_text()
          old = """function parseTime(v){\n  const d = (v || '').replace(/\\D/g, '');\n  if (d.length !== 4) return null;\n  const h = +d.slice(0, 2), m = +d.slice(2);\n  return (h > 23 || m > 59) ? null : h * 60 + m;\n}\n"""
          new = old + """\n// Fuel entries are deliberately conservative: the app does not invent an\n// aircraft-specific upper limit, but an empty, non-numeric, zero or overlong\n// value cannot satisfy an in-flight fuel check.\nfunction validFuelEntry(v){\n  const d = String(v ?? '');\n  return /^\\d{1,5}$/.test(d) && +d > 0;\n}\n"""
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = "module.exports = { norm, fmt, hhmm, parseTime, wrapMin, sinceDueAt, computeResult,"
          new = "module.exports = { norm, fmt, hhmm, parseTime, validFuelEntry, wrapMin, sinceDueAt, computeResult,"
          assert s.count(old) == 1
          s = s.replace(old, new)
          p.write_text(s)

          p = Path('app.js')
          s = p.read_text()
          changes = [
            ("const hasFuel = p => !!(ACT[p.i] || {}).fuel;",
             "const hasFuel = p => validFuelEntry((ACT[p.i] || {}).fuel);"),
            ("const f = a.fuel !== undefined && a.fuel !== '' ? +a.fuel : null;",
             "const f = validFuelEntry(a.fuel) ? +a.fuel : null;"),
            ("""function bindInputs(){\n  const inputs = [...document.querySelectorAll('#tbl input')];\n""",
             """function refreshInputValidity(){\n  let previousFuel = null;\n  for (const inp of document.querySelectorAll('#tbl input')){\n    const isAto = inp.classList.contains('ato'), value = inp.value;\n    const bad = value.length > 0 && (isAto ? parseTime(value) === null : !validFuelEntry(value));\n    inp.classList.toggle('bad', bad);\n    inp.setAttribute('aria-invalid', bad ? 'true' : 'false');\n    inp.classList.remove('suspect');\n    inp.removeAttribute('title');\n    if (bad){\n      inp.title = isAto ? 'Enter a valid UTC time as HHMM.' : 'Fuel must be a positive number.';\n      continue;\n    }\n    if (!isAto && validFuelEntry(value) && !isSkipped(inp.dataset.i)){\n      const fuel = +value;\n      if (previousFuel !== null && fuel > previousFuel){\n        inp.classList.add('suspect');\n        inp.title = 'Fuel is higher than the previous entered value — check the entry.';\n      }\n      previousFuel = fuel;\n    }\n  }\n}\n\nfunction bindInputs(){\n  const inputs = [...document.querySelectorAll('#tbl input')];\n"""),
            ("""      inp.classList.toggle('bad', isAto && inp.value.length > 0 &&\n                                  (inp.value.length !== 4 || parseTime(inp.value) === null));\n      paint(i); countFilled(); refreshFuel(); refreshProgress(); save();\n""",
             """      refreshInputValidity();\n      paint(i); countFilled(); refreshFuel(); refreshProgress(); save();\n"""),
            ("""    inp.onfocus = () => inp.select();\n  });\n}\n\n/* ================= document fields ================= */\n""",
             """    inp.onfocus = () => inp.select();\n  });\n  refreshInputValidity();\n}\n\n/* ================= document fields ================= */\n"""),
            ("""  renderAlt(true);                 // checks follow the waypoints a direct removed\n  renderFuel();                    // windows follow the waypoints a direct removed\n  save();\n""",
             """  renderAlt(true);                 // checks follow the waypoints a direct removed\n  renderFuel();                    // windows follow the waypoints a direct removed\n  refreshInputValidity();          // fuel-trend warnings follow the flown route too\n  save();\n"""),
            ("""  document.querySelectorAll('#tbl input').forEach(i => { i.value = ''; i.classList.remove('bad'); });\n""",
             """  document.querySelectorAll('#tbl input').forEach(i => {\n    i.value = ''; i.classList.remove('bad', 'suspect'); i.setAttribute('aria-invalid', 'false'); i.removeAttribute('title');\n  });\n"""),
            ("if (a.ato && a.ato.length === 4){",
             "if (parseTime(a.ato) !== null){"),
            ("""    if (a.fuel){\n      const A = ANCHOR + cw;\n""",
             """    if (validFuelEntry(a.fuel)){\n      const A = ANCHOR + cw;\n"""),
            ("""$('#etd').onkeydown = e => { if (e.key === 'Enter'){ e.target.blur(); $('#calc').click(); } };\n""",
             """$('#etd').oninput = () => {\n  const v = $('#etd').value, bad = v.length > 0 && parseTime(v) === null;\n  $('#etd').classList.toggle('bad', bad);\n  $('#etd').setAttribute('aria-invalid', bad ? 'true' : 'false');\n};\n$('#etd').onkeydown = e => { if (e.key === 'Enter'){ e.target.blur(); $('#calc').click(); } };\n"""),
            ("""  if (t0 === null){ msg('#m2', 'Enter the time as HHMM, for example 0210', 'err'); return; }\n  if (!PLAN){ msg('#m2', 'Load a PDF first', 'err'); return; }\n  T0 = t0;\n""",
             """  if (t0 === null){\n    $('#etd').classList.add('bad'); $('#etd').setAttribute('aria-invalid', 'true');\n    msg('#m2', 'Enter the time as HHMM, for example 0210', 'err'); return;\n  }\n  $('#etd').classList.remove('bad'); $('#etd').setAttribute('aria-invalid', 'false');\n  if (!PLAN){ msg('#m2', 'Load a PDF first', 'err'); return; }\n  T0 = t0;\n""")
          ]
          for old, new in changes:
            assert s.count(old) == 1, 'app.js anchor changed: ' + old[:80]
            s = s.replace(old, new)
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          old = "td input.bad{border-color:var(--err)}"
          new = "input.bad{border-color:var(--err)!important}\\ntd input.suspect{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent)}"
          assert s.count(old) == 1
          s = s.replace(old, new)
          p.write_text(s)
          PY

          cat > tests/input-validation.test.js <<'EOF'
          "use strict";
          const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { validFuelEntry } = require('../ofp-core');
          const APP = fs.readFileSync(path.join(__dirname, '..', 'app.js'), 'utf8');
          const HTML = fs.readFileSync(path.join(__dirname, '..', 'index.html'), 'utf8');

          test('only a positive one-to-five digit fuel figure can satisfy a fuel check', () => {
            for (const bad of ['', '0', '00000', '-1', '12A', '123456', null, undefined])
              assert.equal(validFuelEntry(bad), false, String(bad));
            for (const good of ['1', '00001', '2500', '12345'])
              assert.equal(validFuelEntry(good), true, good);
          });

          test('fuel-check state ignores invalid fuel instead of silently treating it as complete', () => {
            assert.match(APP, /const hasFuel = p => validFuelEntry/);
            assert.match(APP, /const f = validFuelEntry\(a\.fuel\) \? \+a\.fuel : null/);
          });

          test('invalid actuals are not written into the exported PDF', () => {
            assert.match(APP, /if \(parseTime\(a\.ato\) !== null\)/);
            assert.match(APP, /if \(validFuelEntry\(a\.fuel\)\)/);
          });

          test('inputs expose invalid state and non-blocking fuel-increase warnings', () => {
            assert.match(APP, /setAttribute\('aria-invalid'/);
            assert.match(APP, /Fuel is higher than the previous entered value — check the entry\./);
            assert.match(HTML, /td input\.suspect\{/);
          });
          EOF

          rm .github/workflows/apply-task15.yml
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Task 15: reject impossible actuals and flag suspicious fuel"
          git push origin HEAD:hardening/reliability-plan
