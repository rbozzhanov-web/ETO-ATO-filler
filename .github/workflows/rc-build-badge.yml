name: Apply RC build badge

on:
  push:
    branches:
      - rc/build-badge-20260902

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc/build-badge-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add visible RC build marker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          BUILD = 'RC 1.3 · TEST · Build 20260902.1'

          p = Path('index.html')
          s = p.read_text()
          css_anchor = '.sub{color:var(--dim);font-size:13px}\n'
          css = '''.buildbadge{display:inline-flex;align-items:center;margin-top:5px;padding:2px 7px;\n  border:1px solid var(--warn);border-radius:999px;color:var(--warn);\n  font:700 10px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;\n  letter-spacing:.35px;text-transform:uppercase;white-space:nowrap}\n'''
          if '.buildbadge{' not in s:
              if css_anchor not in s: raise SystemExit('index CSS anchor not found')
              s = s.replace(css_anchor, css_anchor + css, 1)
          html_anchor = '      <div class="sub">Operational flight plan — in flight</div>\n'
          badge = f'      <div class="buildbadge" id="buildBadge">{BUILD}</div>\n'
          if 'id="buildBadge"' not in s:
              if html_anchor not in s: raise SystemExit('index header anchor not found')
              s = s.replace(html_anchor, html_anchor + badge, 1)
          p.write_text(s)

          p = Path('journey-log.html')
          s = p.read_text()
          css_anchor = '#bar h1 span{color:var(--dim); font-size:13px; letter-spacing:0; font-weight:400}\n'
          css = '''#bar h1 .buildbadge{display:inline-flex;vertical-align:2px;margin-left:8px;padding:2px 7px;\n  border:1px solid var(--warn);border-radius:999px;color:var(--warn);\n  font:700 10px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;\n  letter-spacing:.35px;text-transform:uppercase;white-space:nowrap}\n'''
          if '#bar h1 .buildbadge{' not in s:
              if css_anchor not in s: raise SystemExit('journey CSS anchor not found')
              s = s.replace(css_anchor, css_anchor + css, 1)
          html_anchor = '    <h1>Journey Log</h1>\n'
          badge_line = f'    <h1>Journey Log <span class="buildbadge" id="buildBadge">{BUILD}</span></h1>\n'
          if 'id="buildBadge"' not in s:
              if html_anchor not in s: raise SystemExit('journey header anchor not found')
              s = s.replace(html_anchor, badge_line, 1)
          p.write_text(s)

          p = Path('sw.js')
          s = p.read_text()
          old = "const V = CACHE_PREFIX + 'rc1.3';"
          new = "const V = CACHE_PREFIX + 'rc1.3-test-20260902.1';"
          if old not in s and new not in s: raise SystemExit('service worker version anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Run unit and structure tests
        run: npm test
      - name: Commit tested build marker
        shell: bash
        run: |
          git config user.name "rbozzhanov-web"
          git config user.email "rbozzhanov@gmail.com"
          git rm .github/workflows/rc-build-badge.yml
          git add index.html journey-log.html sw.js
          git commit -m "RC 1.3: show test build identifier"
          git push origin HEAD:rc/build-badge-20260902
