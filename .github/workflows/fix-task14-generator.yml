name: Fix Task 14 generator

on:
  push:
    branches: [hardening/reliability-plan]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[task14-generator-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/reliability-plan
      - name: Fix generated test first line
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/task14-errors.yml')
          s = p.read_text()
          old = "Path('tests/user-errors.test.js').write_text(r'''\\'use strict\\';"
          new = "Path('tests/user-errors.test.js').write_text(r''''use strict';"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
          rm .github/workflows/fix-task14-generator.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Task 14 test generator quoting [task14-generator-fixed]"
          git push origin HEAD:hardening/reliability-plan
