name: Remove storage history UI once

on:
  push:
    branches: [fix/remove-storage-history-ui-20260902]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'RUN_REMOVE_STORAGE_HISTORY_UI')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-storage-history-ui-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove only the marked storage-history UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()
          old = "    <p class=\"disc\">Times, fuel, altimeter readings and document fields are saved on this\n      device only — never sent anywhere — against the exact PDF they were entered for.\n      They are kept for 30 days, and only the 20 most recent flights are held. Clearing\n      keeps the flight open now and removes the rest.</p>\n    <div class=\"row\">\n      <button type=\"button\" class=\"ghost sm\" id=\"clearStored\">Clear other flights</button>\n      <span class=\"disc\" id=\"storedNote\"></span>\n    </div>\n"
          assert s.count(old) == 1, 'storage-history UI block not found exactly once'
          p.write_text(s.replace(old, ''))

          p = Path('app.js')
          s = p.read_text()
          s, n = re.subn(r"function showStoredCount\(\)\{.*?\n\}", "function showStoredCount(){}", s, count=1, flags=re.S)
          assert n == 1, 'showStoredCount function not found exactly once'
          s, n = re.subn(r"\n\$\('#clearStored'\)\.onclick = async \(\) => \{.*?\n\};\n\n\$\('#reset'\)", "\n\n$('#reset')", s, count=1, flags=re.S)
          assert n == 1, 'clearStored UI handler not found exactly once'
          assert "#storedNote" not in s and "#clearStored" not in s
          p.write_text(s)

          p = Path('tests/storage-edge-cases.test.js')
          s = p.read_text()
          old = "test('app keeps the open flight when Clear other flights is used', () => {\n  const app = fs.readFileSync(path.join(__dirname, '..', 'app.js'), 'utf8');\n  assert.match(app, /async function clearStoredPlans\\(keep\\)[\\s\\S]*?for \\(const k of storedPlanKeys\\(\\)\\) if \\(k !== keep\\) dropPlan\\(k\\);/);\n  assert.match(app, /if \\(!keep\\) await dropSession\\(\\);/);\n  assert.match(app, /clearStoredPlans\\(KEY \\|\\| null\\)/);\n});\n\n"
          assert s.count(old) == 1, 'obsolete Clear other flights test not found exactly once'
          p.write_text(s.replace(old, ''))
          PY
      - name: Run tests
        run: npm test
      - name: Commit the minimal UI removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js tests/storage-edge-cases.test.js
          git diff --cached --check
          git commit -m "Remove obsolete storage-history UI"
          git push origin HEAD:fix/remove-storage-history-ui-20260902
